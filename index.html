<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<meta name="description" content="日本語教師が授業の悩みから解決策と練習方法を引ける自己研鑽アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="授業の引き出し">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>授業の引き出し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F7; --sheet:#FFFFFF; --ink:#1B2530; --sub:#5C6873; --line:#D9DFE4;
  --ai:#1F4E78; --ai-soft:#E4EDF5; --before:#8A939B; --before-bg:#F0F1F2;
  --take:#3E7D5A; --take-soft:#E3F0E8; --star:#B8862B;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12181E; --sheet:#1A222A; --ink:#E6EBEF; --sub:#9AA6B0; --line:#2C3740;
  --ai:#8DB6DC; --ai-soft:#1D2E3E; --before:#8993A0; --before-bg:#20282F;
  --take:#7CC29A; --take-soft:#1C3027; --star:#D9AE5C;}}
:root[data-theme="dark"]{
  --paper:#12181E; --sheet:#1A222A; --ink:#E6EBEF; --sub:#9AA6B0; --line:#2C3740;
  --ai:#8DB6DC; --ai-soft:#1D2E3E; --before:#8993A0; --before-bg:#20282F;
  --take:#7CC29A; --take-soft:#1C3027; --star:#D9AE5C;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 110px}
h1,h2,.ttl{font-family:var(--serif);font-weight:700;letter-spacing:.02em}
.brand{font-family:var(--serif);font-size:15px;color:var(--sub);margin:4px 0 18px}
.lead{font-family:var(--serif);font-size:26px;line-height:1.45;margin:0 0 16px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.catdesc{font-size:13px;color:var(--sub);margin:6px 0 4px;min-height:1em}
.list{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.list a{display:flex;gap:12px;align-items:flex-start;padding:15px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.list .ttl{font-size:18px;line-height:1.5;flex:1}
.meta{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--sub);margin-top:3px;letter-spacing:0}
.marks{flex:none;font-size:13px;display:flex;gap:6px;padding-top:4px}
.m-star{color:var(--star)} .m-tried{color:var(--take)}
.empty{color:var(--sub);font-size:14px;padding:22px 0}
/* detail */
.back{border:0;background:none;color:var(--ai);padding:4px 0;cursor:pointer;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--sub);background:var(--sheet)}
.dtitle{font-size:28px;line-height:1.45;margin:4px 0 16px}
.actions{display:flex;gap:10px;margin-bottom:26px}
.act{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 8px;cursor:pointer;font-size:14px}
.act[aria-pressed="true"].fav{border-color:var(--star);color:var(--star)}
.act[aria-pressed="true"].tried{border-color:var(--take);color:var(--take);background:var(--take-soft)}
section{margin:0 0 30px}
h2{font-size:19px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
ul.b{margin:0;padding-left:1.2em} ul.b li{margin:4px 0}
.signs li{list-style:none;margin-left:-1.2em;padding-left:1.6em;position:relative}
.signs li::before{content:"";position:absolute;left:.1em;top:.55em;width:.8em;height:.8em;border:1.5px solid var(--sub);border-radius:3px}
.points{counter-reset:p;list-style:none;padding:0;margin:0}
.points li{counter-increment:p;position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line)}
.points li:last-child{border-bottom:0}
.points li::before{content:counter(p);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-weight:700;font-size:14px;display:grid;place-items:center;line-height:1}
/* before/after — the one bold element */
.ex{margin:0 0 22px}
.scene{font-size:14px;color:var(--sub);margin:0 0 10px;padding-left:10px;border-left:3px solid var(--line)}
.say{border-radius:10px;padding:12px 14px 12px;white-space:pre-line;position:relative}
.say .lab{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.say.before{background:var(--before-bg);color:var(--sub);border:1px dashed var(--before)}
.say.before .lab{color:var(--before)}
.turn{display:flex;align-items:center;gap:8px;color:var(--ai);font-size:13px;margin:8px 0 8px 14px}
.turn svg{flex:none}
.say.after{background:var(--ai-soft);border-left:5px solid var(--ai);font-size:17px;line-height:1.85}
.say.after .lab{color:var(--ai)}
.note{font-size:14.5px;margin:10px 2px 0;color:var(--ink)}
.note b{color:var(--ai)}
.practice li{margin:8px 0}
.memo textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);resize:vertical;font-size:16px;line-height:1.6}
.memo .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.hint{font-size:12.5px;color:var(--sub)}
.save{border:0;background:var(--ai);color:var(--sheet);border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:700}
.save:disabled{opacity:.4;cursor:default}
.memos{list-style:none;padding:0;margin:14px 0 0}
.memos li{padding:10px 0;border-top:1px solid var(--line);white-space:pre-line;font-size:15px}
.memos time{display:block;font-size:12px;color:var(--sub)}
.memos .del{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:0;margin-top:2px;text-decoration:underline}
.memos .from{font-size:13px;color:var(--ai);text-decoration:none;display:block;margin-bottom:2px}
.rel a{display:block;padding:9px 0;color:var(--ai);text-decoration:none;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700}
.ref{font-size:13px;color:var(--sub)}
.stat{display:flex;gap:24px;margin:4px 0 18px}
.stat div{font-size:13px;color:var(--sub)} .stat b{display:block;font-size:24px;color:var(--ink);font-family:var(--serif)}
.yomi{font-size:13px;color:var(--sub);margin:-10px 0 14px}
.tshort{font-size:17px;line-height:1.8;background:var(--ai-soft);border-radius:10px;padding:12px 14px;margin:0 0 26px}
.tag.asof{border-color:var(--star);color:var(--star)}
.desc{margin:0}
.tlist .short{display:block;font-family:var(--sans);font-weight:400;font-size:13.5px;color:var(--sub);margin-top:4px;line-height:1.6;letter-spacing:0}
.tlist .ttl{font-size:17px}
.sub2{font-size:15px;margin:26px 0 0;color:var(--sub);font-family:var(--sans);font-weight:700;border:0;padding:0}
.rel a.t{font-family:var(--sans)}
.rel a small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--sub)}
.exl{list-style:none;margin:0;padding:0}
.exl li{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:0 0 8px;font-size:15.5px}
.pit{list-style:none;margin:0;padding:0}
.pit li{position:relative;padding:8px 0 8px 30px;border-bottom:1px dashed var(--line)}
.pit li:last-child{border-bottom:0}
.pit li::before{content:"!";position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--star);color:var(--star);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.sec{font-size:17px;margin:26px 0 4px;border:0;padding:0}
.sec .cnt{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--sub)}
.today{display:block;margin:18px 0 10px;padding:16px 16px 14px;border-radius:14px;background:var(--ai);color:#fff;text-decoration:none}
.today .tlab{display:block;font-size:12px;letter-spacing:.08em;opacity:.8}
.today .ttl2{display:block;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.5;margin:4px 0 6px}
.today .tpt{display:block;font-size:14px;line-height:1.65;opacity:.92}
.today .tmeta{display:block;font-size:12.5px;margin-top:8px;opacity:.8;text-align:right}
:root[data-theme="dark"] .today,.dk .today{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .today{background:#244a6b}}
:root[data-theme="dark"] .today{background:#244a6b}
.todayt{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:inherit;text-decoration:none;margin-bottom:14px}
.todayt .tlab{display:block;font-size:12px;color:var(--sub)}
.todayt b{display:block;font-family:var(--serif);font-size:17px;margin:2px 0}
.todayt span:last-child{font-size:13.5px;color:var(--sub);line-height:1.6;display:block}
.prog{margin:6px 0 4px}
.prog .pl{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--sub)}
.prog .pl b{font-family:var(--serif);font-size:20px;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--take)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:72px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:inherit;text-decoration:none}
.tile b{font-family:var(--serif);font-size:15.5px;line-height:1.4}
.tile span{font-size:12px;color:var(--sub);margin-top:6px}
.allbtn{display:block;text-align:center;margin:14px 0 0;padding:12px;border-radius:10px;border:1px solid var(--ai);color:var(--ai);text-decoration:none;font-size:14.5px}
.m-new{font-size:10.5px;color:var(--ai);border:1px solid var(--ai);border-radius:4px;padding:0 4px;line-height:1.6;align-self:flex-start}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:26px 0 6px}
.pn a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:inherit;text-decoration:none;font-size:13.5px;line-height:1.5}
.pn a small{display:block;color:var(--ai);font-size:12px;margin-bottom:2px}
.pn a.nx{text-align:right}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.fsel{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
.fsel select{font-size:14.5px;padding:8px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.fclear{border:0;background:none;color:var(--ai);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 0}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qc{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.qc small{color:var(--sub);font-size:11px}
.tag.st{border-color:var(--take);color:var(--take)}
.tag.tb{cursor:pointer;border-color:var(--ai);color:var(--ai);font:inherit;font-size:12.5px}
.prefs{margin:0 0 26px}
.fbar.one{grid-template-columns:1fr}
.kana{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 2px}
.kn{min-width:38px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 6px;font-size:14px;cursor:pointer}
.kn[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.khead{list-style:none;font-family:var(--serif);font-weight:700;color:var(--ai);font-size:15px;padding:12px 2px 4px;border-bottom:1px solid var(--line)}
.allbtn.more{width:100%;background:none;cursor:pointer;font:inherit;font-size:14.5px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav a{flex:1;text-align:center;padding:10px 0 9px;font-size:12.5px;color:var(--sub);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
nav a[aria-current="page"]{color:var(--ai);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.itip{position:relative;margin:14px 0 0;padding:12px 14px 12px;border:1px dashed var(--ai);border-radius:12px;background:var(--ai-soft);font-size:13px;line-height:1.7}
.itip b{display:block;font-size:14px;color:var(--ai);margin-bottom:4px;padding-right:48px}
.itip span{color:var(--ink)}
.itip button{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline}
.bkrow{display:flex;gap:10px;margin-top:10px}
.bkrow .act{text-align:center;display:block}
.loading{padding:40vh 0 0;text-align:center;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="loading">読み込んでいます…</p></main>
<nav aria-label="メインメニュー"><div class="in">
 <a href="#/" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>さがす</a>
 <a href="#/dict" data-nav="dict"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5c2.5-1 5.5-1 8 .5v14c-2.5-1.5-5.5-1.5-8-.5z"/><path d="M20 5.5c-2.5-1-5.5-1-8 .5v14c2.5-1.5 5.5-1.5 8-.5z"/></svg>用語辞典</a>
 <a href="#/fav" data-nav="fav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>お気に入り</a>
 <a href="#/log" data-nav="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3.5h11l3 3v14H5z"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>ふりかえり</a>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  function fail(){document.getElementById("app").innerHTML='<p class="loading">データを読み込めませんでした。<br>インターネットに接続して、もう一度開いてください。</p>'}
  fetch("data.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    window.__DATA=d; var s=document.createElement("script"); s.src="app.js?v="+encodeURIComponent(d.builtAt||""); document.body.appendChild(s);
  }).catch(fail);
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
